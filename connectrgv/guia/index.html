<main>

  </nav>
</div>

<section class="blk alt" id="agua"><div class="wrap">
  <p class="num">01</p>
  <h2 data-t="waterH"></h2>
  <p class="lead" data-t="waterLead"></p>
  <div id="agua-ciudad"></div>
  <h3 style="margin-top:36px" data-t="wscH"></h3>
  <p style="margin:8px 0 0;color:#3A403D" data-t="wscLead"></p>
  <div class="grid2" id="wsc"></div>
  <p class="note" data-t="checked"></p>
</div></section>

<section class="blk" id="homestead"><div class="wrap">
  <p class="num">02</p>
  <h2 data-t="homeH"></h2>
  <p class="lead" data-t="homeLead"></p>
  <ol class="check" id="home-steps"></ol>
  <div id="cad"></div>
  <p class="note" data-t="homeNote"></p>
</div></section>

<section class="blk alt" id="domicilio"><div class="wrap">
  <p class="num">03</p>
  <h2 data-t="addrH"></h2>
  <p class="lead" data-t="addrLead"></p>
  <ul class="check" id="addr"></ul>
</div></section>

<section class="blk"><div class="wrap">
  <div class="cta">
    <div><h2 data-t="ctaH"></h2><p data-t="ctaP"></p></div>
    <div class="btns" style="margin:0"><a class="btn" href="tel:+19564676695" data-t="ctaCall"></a><a class="btn ghost" style="border-color:#F4F2EE;color:#F4F2EE" href="#llamar" data-t="ctaWeb"></a></div>
  </div>
</div></section>
</main>

<dialog class="ll" id="llamar" aria-labelledby="ll-h">
  <button type="button" class="x" data-close aria-label="Cerrar">×</button>
  <form id="ll-form" novalidate>
    <h2 id="ll-h" data-t="llH"></h2>
    <p class="s" data-t="llP"></p>
    <label for="ll-n" data-t="llName"></label><input id="ll-n" name="nombre" autocomplete="name" required maxlength="80">
    <label for="ll-t" data-t="llTel"></label><input id="ll-t" name="telefono" type="tel" autocomplete="tel" inputmode="tel" required maxlength="20">
    <div class="row2">
      <div><label for="ll-c" data-t="llCity"></label><input id="ll-c" name="ciudad" autocomplete="address-level2" maxlength="40"></div>
      <div><label for="ll-f" data-t="llDate"></label><input id="ll-f" name="fecha" type="date"></div>
    </div>
    <label for="ll-d" data-t="llAddr"></label><input id="ll-d" name="direccion" autocomplete="street-address" maxlength="160">
    <p class="err" id="ll-err" hidden></p>
    <div class="btns" style="margin-top:20px"><button type="submit" class="btn" id="ll-go" data-t="llSend"></button></div>
    <p class="s" style="font-size:13px" data-t="llFine"></p>
  </form>
  <div class="ok" id="ll-ok" hidden>
    <h2 data-t="llOkH"></h2>
    <p class="s" data-t="llOkP"></p>
    <div class="btns" style="margin-top:20px"><button type="button" class="btn" data-close data-t="llBack"></button></div>
  </div>
</dialog>

<footer><div class="wrap">

</div></footer>
