<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MirComm Inventory — Palmhurst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080E1A;
    --surface: #0D1629;
    --surface2: #131E35;
    --border: #1E2E4A;
    --blue: #1A6EFF;
    --blue-dim: #1040AA;
    --cyan: #00C4E8;
    --green: #00E887;
    --red: #FF4455;
    --yellow: #FFD166;
    --text: #E8EDF5;
    --muted: #6A7A96;
    --palmhurst: #1A6EFF;
    
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(8,14,26,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; height: 56px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-right: 8px;
  }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .config-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 6px 14px; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-family: var(--font-body);
    transition: all .2s;
  }
  .config-btn:hover { border-color: var(--blue); color: var(--text); }

  /* ── LAYOUT ── */
  .main { padding-top: 56px; display: flex; height: 100vh; }

  .sidebar {
    width: 200px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .nav-section { font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase; padding: 12px 8px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--muted); font-size: 13px; font-weight: 500;
    transition: all .15s; border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(26,110,255,0.12); color: var(--blue);
    border-color: rgba(26,110,255,0.2); }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── CONFIG SCREEN ── */
  .config-screen {
    max-width: 480px; margin: 40px auto; text-align: center;
  }
  .config-screen h2 { font-family: var(--font-display); font-size: 28px; margin-bottom: 8px; }
  .config-screen p { color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
  .config-input {
    width: 100%; padding: 12px 16px; border-radius: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
    outline: none; margin-bottom: 12px; transition: border .2s;
  }
  .config-input:focus { border-color: var(--blue); }
  .config-input::placeholder { color: var(--muted); }

  /* ── CARDS / STATS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }
  .stat-card.blue::before { background: var(--blue); }
  .stat-card.cyan::before { background: var(--cyan); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.yellow::before { background: var(--yellow); }
  .stat-card.red::before { background: var(--red); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
  .stat-card.blue .stat-value { color: var(--blue); }
  .stat-card.cyan .stat-value { color: var(--cyan); }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.yellow .stat-value { color: var(--yellow); }
  .stat-card.red .stat-value { color: var(--red); }

  /* ── TABLE ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; }
  .table-title { font-family: var(--font-display); font-size: 16px; font-weight: 800; }
  .search-input {
    padding: 7px 12px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text); font-family: var(--font-body);
    font-size: 13px; outline: none; width: 220px; transition: border .2s;
  }
  .search-input:focus { border-color: var(--blue); }
  .search-input::placeholder { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  tbody tr { border-bottom: 1px solid rgba(30,46,74,0.5); transition: background .15s; cursor: pointer; }
  tbody tr:hover { background: var(--surface2); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 11px 16px; font-size: 13px; }
  td.mono { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-ok { background: rgba(0,232,135,0.12); color: var(--green); }
  .badge-low { background: rgba(255,209,102,0.12); color: var(--yellow); }
  .badge-out { background: rgba(255,68,85,0.12); color: var(--red); }
  .badge-completed { background: rgba(0,232,135,0.12); color: var(--green); }
  .badge-voided { background: rgba(255,68,85,0.12); color: var(--red); }

  .action-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  /* ── BUTTONS ── */
  .btn {
    padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; font-family: var(--font-body); transition: all .15s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #2479ff; transform: translateY(-1px); }
  .btn-success { background: rgba(0,232,135,0.15); color: var(--green); border: 1px solid rgba(0,232,135,0.3); }
  .btn-success:hover { background: rgba(0,232,135,0.25); }
  .btn-danger { background: rgba(255,68,85,0.1); color: var(--red); border: 1px solid rgba(255,68,85,0.3); }
  .btn-danger:hover { background: rgba(255,68,85,0.2); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; width: 480px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    transform: translateY(20px); transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title {
    font-family: var(--font-display); font-size: 20px; font-weight: 800;
    margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
  }
  .modal-close {
    margin-left: auto; background: var(--surface2); border: none; color: var(--muted);
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--text); }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .form-input {
    width: 100%; padding: 10px 14px; border-radius: 9px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-body); font-size: 13px;
    outline: none; transition: border .2s;
  }
  .form-input:focus { border-color: var(--blue); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-select { appearance: none; cursor: pointer; }

  /* ── POS ── */
  .pos-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .pos-cart { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .pos-cart-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .pos-cart-header h3 { font-family: var(--font-display); font-size: 16px; font-weight: 800; }
  .cart-items { max-height: 280px; overflow-y: auto; }
  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid rgba(30,46,74,0.5);
  }
  .cart-item-name { flex: 1; font-size: 13px; font-weight: 500; }
  .cart-item-price { font-family: var(--font-mono); font-size: 13px; color: var(--cyan); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { border-color: var(--blue); color: var(--blue); }
  .qty-val { font-family: var(--font-mono); font-size: 13px; min-width: 24px; text-align: center; }
  .remove-item { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .remove-item:hover { color: var(--red); }
  .pos-totals { padding: 16px 20px; border-top: 1px solid var(--border); }
  .total-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: var(--muted); }
  .total-row.grand { color: var(--text); font-size: 18px; font-weight: 700; font-family: var(--font-display); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .total-row span:last-child { font-family: var(--font-mono); }
  .discount-input { display: flex; gap: 8px; margin-bottom: 12px; }
  .discount-input input { flex: 1; }
  .payment-select { margin-bottom: 12px; }

  /* ── TOAST ── */
  .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 10px; min-width: 240px;
    animation: slideIn .25s ease; border: 1px solid;
  }
  .toast-success { background: rgba(0,232,135,0.1); border-color: rgba(0,232,135,0.3); color: var(--green); }
  .toast-error { background: rgba(255,68,85,0.1); border-color: rgba(255,68,85,0.3); color: var(--red); }
  .toast-info { background: rgba(26,110,255,0.1); border-color: rgba(26,110,255,0.3); color: var(--blue); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .receipt-preview {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; font-family: var(--font-mono); font-size: 12px;
    line-height: 1.8; white-space: pre-wrap;
  }

  .page-title { font-family: var(--font-display); font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .page-subtitle { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
  .store-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot-palmhurst { background: var(--palmhurst); }


  .date-filter { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .date-filter label { font-size: 12px; color: var(--muted); }
  .date-filter input { width: 150px; }

  .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }

  .low-stock-badge { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
    background: rgba(26,110,255,0.1); color: var(--blue); letter-spacing: .3px;
  }

  .scan-input-wrap { position: relative; }
  .scan-input-wrap::after {
    content: '⌨'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px;
  }

  .no-sheet-notice {
    background: rgba(255,209,102,0.07); border: 1px solid rgba(255,209,102,0.2);
    border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--yellow);
    margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--blue-dim); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">MirComm</div>
  <div style="color:var(--muted);font-size:12px;font-weight:600">INVENTORY</div>
  <div class="topbar-right">
    <button class="config-btn" onclick="openConfig()">⚙ Configure</button>
  </div>
</div>

<!-- SIDEBAR + CONTENT -->
<div class="main">
  <div class="sidebar">
    <div class="nav-section">Operations</div>
    <div class="nav-item active" data-page="inventory" onclick="showPage('inventory')">
      <span class="icon">📦</span> Inventory
    </div>
    <div class="nav-item" data-page="pos" onclick="showPage('pos')">
      <span class="icon">🛒</span> Point of Sale
    </div>
    <div class="nav-section">Reports</div>
    <div class="nav-item" data-page="transactions" onclick="showPage('transactions')">
      <span class="icon">📋</span> Transactions
    </div>
    <div class="nav-item" data-page="report" onclick="showPage('report')">
      <span class="icon">📊</span> Sales Report
    </div>
    <div class="nav-section">Stock</div>
    <div class="nav-item" data-page="receive" onclick="showPage('receive')">
      <span class="icon">📥</span> Receive Stock
    </div>
  </div>

  <div class="content" id="content">
    <!-- Pages rendered here -->
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div id="modal-content"></div>
  </div>
</div>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="config-overlay" onclick="closeConfig(event)">
  <div class="modal" id="config-box">
    <div class="modal-title">⚙ Configure
      <button class="modal-close" onclick="document.getElementById('config-overlay').classList.remove('open')">✕</button>
    </div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6">
      Paste your Google Apps Script Web App URL below. Deploy it from your Google Sheet
      (Extensions → Apps Script → Deploy → New Deployment → Web App).
    </p>
    <div class="form-group">
      <label class="form-label">Web App URL</label>
      <textarea id="config-url-input" class="form-input" rows="3" placeholder="https://script.google.com/macros/s/.../exec" style="resize:vertical"></textarea>
    </div>
    <button class="btn btn-primary btn-full" onclick="saveConfig()">Save & Connect</button>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────
let SHEETS_URL = localStorage.getItem('mircomm_url') || '';
let currentStore = 'palmhurst';
let currentPage = 'inventory';
let stockData = [];
let cart = [];
let cartEmployee = '';
let discountAmt = 0;
let discountDesc = '';
let paymentMethod = 'cash';
const TAX_RATE = 0.0825;

// ─── CONFIG ──────────────────────────────────────────────────────────
function openConfig() {
  document.getElementById('config-url-input').value = SHEETS_URL;
  document.getElementById('config-overlay').classList.add('open');
}
function closeConfig(e) {
  if (e.target === document.getElementById('config-overlay'))
    document.getElementById('config-overlay').classList.remove('open');
}
function saveConfig() {
  const url = document.getElementById('config-url-input').value.trim();
  SHEETS_URL = url;
  localStorage.setItem('mircomm_url', url);
  document.getElementById('config-overlay').classList.remove('open');
  toast('Configuration saved!', 'success');
  loadCurrentPage();
}

// ─── STORE ───────────────────────────────────────────────────────────
function setStore(s) {
  currentStore = s;
  cart = [];
  loadCurrentPage();
}

// ─── NAVIGATION ──────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
  loadCurrentPage();
}
function loadCurrentPage() {
  switch(currentPage) {
    case 'inventory':    renderInventory(); break;
    case 'pos':          renderPOS(); break;
    case 'transactions': renderTransactions(); break;
    case 'report':       renderReport(); break;
    case 'receive':      renderReceive(); break;
  }
}

// ─── API ─────────────────────────────────────────────────────────────
async function apiGet(params) {
  if (!SHEETS_URL) { openConfig(); throw new Error('No URL configured'); }
  const url = new URL(SHEETS_URL);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url.toString());
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}
async function apiPost(body) {
  if (!SHEETS_URL) { openConfig(); throw new Error('No URL configured'); }
  const r = await fetch(SHEETS_URL, {
    method: 'POST',
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

// ─── TOAST ───────────────────────────────────────────────────────────
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const icons = { success: '✓', error: '✗', info: 'ℹ' };
  el.innerHTML = `<span>${icons[type]}</span>${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── MODAL ───────────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ─── INVENTORY PAGE ──────────────────────────────────────────────────
async function renderInventory() {
  const el = document.getElementById('content');
  if (!SHEETS_URL) {
    el.innerHTML = noSheetNotice(); return;
  }
  el.innerHTML = `<div class="page-title"><span class="store-dot dot-${currentStore}"></span>Inventory</div>
    <div class="page-subtitle">Live stock for ${'Palmhurst'} location</div>
    <div class="loading"><div class="spinner"></div></div>`;
  try {
    stockData = await apiGet({ action: 'getStock', store: currentStore });
    renderInventoryTable(stockData);
  } catch(e) { el.innerHTML = errorState(e.message); }
}

function renderInventoryTable(data, filter='') {
  const el = document.getElementById('content');
  const low = data.filter(p => (parseInt(p.Quantity)||0) > 0 && (parseInt(p.Quantity)||0) <= (parseInt(p.MinQty)||5)).length;
  const out = data.filter(p => (parseInt(p.Quantity)||0) === 0).length;
  const totalValue = data.reduce((s,p) => s + (parseFloat(p.Price)||0)*(parseInt(p.Quantity)||0), 0);

  const filtered = data.filter(p =>
    !filter ||
    String(p.Name).toLowerCase().includes(filter) ||
    String(p.Barcode).includes(filter) ||
    String(p.Category).toLowerCase().includes(filter)
  );

  el.innerHTML = `
    <div class="page-title"><span class="store-dot dot-${currentStore}"></span>Inventory</div>

function autofillFromStock() {
  const barcode = document.getElementById('rc-barcode').value.trim();
  if (!barcode || !stockData.length) return;
  const match = stockData.find(p => String(p.Barcode) === barcode);
  if (match) {
    document.getElementById('rc-name').value = match.Name;
    document.getElementById('rc-cat').value = match.Category || '';
    document.getElementById('rc-price').value = match.Price || '';
    document.getElementById('rc-min').value = match.MinQty || 5;
    toast('Product found — updating stock.', 'info');
  }
}

async function submitReceive() {
  const barcode = document.getElementById('rc-barcode').value.trim();
  const name = document.getElementById('rc-name').value.trim();
  const category = document.getElementById('rc-cat').value.trim();
  const price = document.getElementById('rc-price').value;
  const minQty = document.getElementById('rc-min').value;
  const qty = document.getElementById('rc-qty').value;
  if (!barcode || !name || !qty) { toast('Barcode, name, and qty are required.', 'error'); return; }
  try {
    const r = await apiPost({ action: 'receiveStock', store: currentStore, barcode, name, category, price, minQty, qty });
    toast(`✓ ${r.action === 'added' ? 'New product added' : 'Stock updated'} — Qty: ${r.newQty}`, 'success');
    renderReceive();
    stockData = []; // clear cache
  } catch(e) { toast(e.message, 'error'); }
}

async function renderPOS() {

    catch(e) { el.innerHTML = errorState(e.message); return; }
  }
  renderPOSLayout();
}

function renderPOSLayout() {
  const el = document.getElementById('content');
  const subtotal = cart.reduce((s,i) => s + i.price*i.qty, 0);
  const discount = Math.min(discountAmt, subtotal);
  const taxable = subtotal - discount;
  const tax = taxable * TAX_RATE;
  const total = taxable + tax;

  el.innerHTML = `
    <div class="page-title">🛒 Point of Sale</div>
    <div class="page-subtitle">${'Palmhurst'} · ${new Date().toLocaleDateString()}</div>
    <div class="pos-layout">
      <div>
        <div class="action-row">
          <div class="scan-input-wrap" style="flex:1">
            <input class="form-input" id="pos-search" placeholder="Search or scan barcode to add…"
              oninput="renderProductGrid(this.value)">
          </div>
          <select class="form-input form-select" id="pos-employee" style="width:180px" onchange="cartEmployee=this.value">
            <option value="">— Employee —</option>
            <option>Joel</option><option>Daisy</option><option>Other</option>
          </select>
        </div>
        <div id="product-grid"></div>
      </div>
      <div>
        <div class="pos-cart">
          <div class="pos-cart-header"><h3>Cart (${cart.length} item${cart.length!==1?'s':''})</h3></div>
          <div class="cart-items" id="cart-items">
            ${cart.length === 0 ? '<div class="empty-state" style="padding:30px"><div class="icon">🛒</div><p>Cart is empty</p></div>' :
              cart.map((item,i) => `
              <div class="cart-item">
                <div style="flex:1">
                  <div class="cart-item-name">${item.name}</div>
                  <div class="cart-item-price">$${(item.price*item.qty).toFixed(2)}</div>
                </div>
                <div class="qty-ctrl">
                  <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
                  <span class="qty-val">${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
                </div>
                <button class="remove-item" onclick="removeFromCart(${i})">✕</button>
              </div>`).join('')}
          </div>
          <div class="pos-totals">
            <div class="discount-input">
              <input class="form-input" type="number" id="disc-amt" placeholder="Discount $" value="${discountAmt||''}"
                oninput="discountAmt=parseFloat(this.value)||0;updateCartTotals()">
              <input class="form-input" id="disc-desc" placeholder="Reason" value="${discountDesc}"
                oninput="discountDesc=this.value">
            </div>
            <div class="payment-select">
              <select class="form-input form-select" id="payment-method" onchange="paymentMethod=this.value">
                <option value="cash">💵 Cash</option>
                <option value="card" ${paymentMethod==='card'?'selected':''}>💳 Card</option>
              </select>
            </div>
            <div class="total-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
            ${discount>0?`<div class="total-row" style="color:var(--green)"><span>Discount</span><span>-$${discount.toFixed(2)}</span></div>`:''}
            <div class="total-row"><span>Tax (8.25%)</span><span>$${tax.toFixed(2)}</span></div>
            <div class="total-row grand"><span>Total</span><span>$${total.toFixed(2)}</span></div>
            <button class="btn btn-primary btn-full" style="margin-top:12px" ${cart.length===0?'disabled':''} onclick="completeSale()">
              ✓ Complete Sale · $${total.toFixed(2)}
            </button>
            <button class="btn btn-ghost btn-full" style="margin-top:8px" ${cart.length===0?'disabled':''} onclick="cart=[];discountAmt=0;discountDesc='';renderPOSLayout()">
              🗑 Clear Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
  renderProductGrid('');
}

function renderProductGrid(filter) {
  const el = document.getElementById('product-grid');
  if (!el) return;
  const f = filter.toLowerCase();
  const products = stockData.filter(p =>
    (parseInt(p.Quantity)||0) > 0 &&
    (!f || p.Name.toLowerCase().includes(f) || String(p.Barcode).includes(f))
  ).slice(0, 30);

  if (!products.length) {
    el.innerHTML = `<div class="empty-state" style="padding:30px"><div class="icon">🔍</div><p>No products found</p></div>`;
    return;
  }
  el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">
    ${products.map(p => `
      <div onclick="addToCart('${p.Barcode}')" style="background:var(--surface);border:1px solid var(--border);
        border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;user-select:none"
        onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${p.Category||''}</div>
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;line-height:1.3">${p.Name}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-family:var(--font-mono);color:var(--cyan);font-size:14px">$${parseFloat(p.Price||0).toFixed(2)}</span>
          <span style="font-size:11px;color:var(--muted)">×${p.Quantity}</span>
        </div>
      </div>`).join('')}
  </div>`;
}

function addToCart(barcode) {
  const p = stockData.find(x => String(x.Barcode) === String(barcode));
  if (!p) return;
  const existing = cart.find(i => i.barcode === String(p.Barcode));
  const maxQty = parseInt(p.Quantity)||0;
  if (existing) {
    if (existing.qty >= maxQty) { toast(`Only ${maxQty} in stock.`, 'error'); return; }
    existing.qty++;
  } else {
    cart.push({ barcode: String(p.Barcode), name: p.Name, price: parseFloat(p.Price||0), qty: 1 });
  }
  renderPOSLayout();
}

function changeQty(i, delta) {
  const item = cart[i];
  const stock = stockData.find(p => p.Barcode == item.barcode);
  const max = stock ? parseInt(stock.Quantity)||0 : 99;
  item.qty = Math.max(1, Math.min(item.qty + delta, max));
  renderPOSLayout();
}
function removeFromCart(i) { cart.splice(i,1); renderPOSLayout(); }
function updateCartTotals() { renderPOSLayout(); }

async function completeSale() {
  if (!cart.length) return;
  const subtotal = cart.reduce((s,i) => s + i.price*i.qty, 0);
  const discount = Math.min(discountAmt, subtotal);
  const taxable = subtotal - discount;
  const tax = taxable * TAX_RATE;
  const total = taxable + tax;
  cartEmployee = document.getElementById('pos-employee')?.value || cartEmployee;
  paymentMethod = document.getElementById('payment-method')?.value || paymentMethod;
  try {
    const r = await apiPost({
      action: 'recordSale', store: currentStore,
      employee: cartEmployee, payment: paymentMethod,
      items: cart, subtotal, discountAmount: discount,
      discountDesc, tax, total
    });
    toast(`Sale ${r.saleId} completed! $${total.toFixed(2)}`, 'success');
    showReceipt(r.saleId, cart, subtotal, discount, discountDesc, tax, total, paymentMethod);
    cart = []; discountAmt = 0; discountDesc = '';
    stockData = []; // refresh
  } catch(e) { toast(e.message, 'error'); }
}

function showReceipt(saleId, items, subtotal, discount, discountDesc, tax, total, payment) {
  const now = new Date();
  const lines = items.map(i => `  ${i.name.padEnd(24,' ')} x${i.qty}  $${(i.price*i.qty).toFixed(2)}`).join('\n');
  openModal(`
    <div class="modal-title">🧾 Receipt
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="receipt-preview">MirComm ${'Palmhurst'}
${'4415 N. Conway Ave. Ste. 180'}
${now.toLocaleString()}
Sale ID: ${saleId}
────────────────────────────────
${lines}
────────────────────────────────
Subtotal:        $${subtotal.toFixed(2)}${discount>0?`
Discount (${discountDesc||'—'}): -$${discount.toFixed(2)}`:''}
Tax (8.25%):     $${tax.toFixed(2)}
TOTAL:           $${total.toFixed(2)}
Payment:         ${payment.toUpperCase()}
────────────────────────────────
Thank you for choosing MirComm!
    </div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-primary" style="flex:1" onclick="closeModal();renderPOS()">New Sale</button>
    </div>
  `);
}

            let items = [];

            const isVoided = String(tx.Status).toLowerCase() === 'voided';

              <td><span class="tag">${tx.Payment||'cash'}</span></td>
              <td class="mono">${parseFloat(tx.DiscountAmount||0)>0?`$${parseFloat(tx.DiscountAmount).toFixed(2)}`:'—'}</td>
              <td class="mono" style="font-weight:600">$${parseFloat(tx.Total||0).toFixed(2)}</td>
              <td><span class="badge badge-${String(tx.Status).toLowerCase()}">${tx.Status}</span></td>
              <td>${!isVoided?`<button class="btn btn-danger btn-sm" onclick="voidSalePrompt('${tx.SaleID}')">Void</button>`:''}</td>
            </tr>`;
          }).join('')}
      </tbody></table></div>`;
  } catch(e) { el.innerHTML = errorState(e.message); }
}

        <div class="stat-card green"><div class="stat-label">Total Revenue</div><div class="stat-value">$${r.totalRevenue.toFixed(0)}</div></div>
        <div class="stat-card blue"><div class="stat-label">Cash Revenue</div><div class="stat-value">$${r.cashRevenue.toFixed(0)}</div></div>
        <div class="stat-card cyan"><div class="stat-label">Card Revenue</div><div class="stat-value">$${r.cardRevenue.toFixed(0)}</div></div>
        <div class="stat-card yellow"><div class="stat-label">Units Sold</div><div class="stat-value">${r.totalSold}</div></div>
        <div class="stat-card yellow"><div class="stat-label">Units Received</div><div class="stat-value">${r.totalReceived}</div></div>
        <div class="stat-card red"><div class="stat-label">Discounts Given</div><div class="stat-value">$${r.totalDiscount.toFixed(0)}</div></div>
        <div class="stat-card red"><div class="stat-label">Voided Sales</div><div class="stat-value">${r.voidedCount}</div></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Barcode</th><th>Product</th><th>Category</th><th>Price</th>
          <th>On Hand</th><th>Sold</th><th>Revenue</th><th>Received</th>
        </tr></thead>
        <tbody>
          ${r.rows.sort((a,b)=>b.soldRev-a.soldRev).map(p=>`<tr>
            <td class="mono">${p.Barcode}</td>
            <td style="font-weight:500">${p.Name}</td>
            <td><span class="tag">${p.Category||'—'}</span></td>
            <td class="mono">$${parseFloat(p.Price||0).toFixed(2)}</td>
            <td style="font-weight:600">${p.Quantity}</td>
            <td style="color:${p.soldQty>0?'var(--green)':'var(--muted)'};font-weight:600">${p.soldQty}</td>
            <td class="mono" style="color:var(--cyan)">$${(p.soldRev||0).toFixed(2)}</td>
            <td style="color:var(--muted)">${p.rcvdQty||0}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
  } catch(e) { el.innerHTML = errorState(e.message); }
}

// ─── HELPERS ──────────────────────────────────────────────────────────
function noSheetNotice() {
  return `<div style="max-width:480px;margin:60px auto;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">🔗</div>
    <div class="page-title" style="margin-bottom:8px">Connect Google Sheets</div>
    <p style="color:var(--muted);margin-bottom:24px;line-height:1.6">
      Paste your Google Apps Script Web App URL to get started.<br>
      (Extensions → Apps Script → Deploy → New Deployment → Web App)
    </p>
    <button class="btn btn-primary" onclick="openConfig()">⚙ Configure URL</button>
  </div>`;
}

function errorState(msg) {
  return `<div class="empty-state"><div class="icon">⚠️</div><p style="color:var(--red)">${msg}</p>
    <button class="btn btn-ghost" style="margin-top:12px" onclick="loadCurrentPage()">Retry</button></div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────
setStore('palmhurst');
</script>
</body>
</html>
